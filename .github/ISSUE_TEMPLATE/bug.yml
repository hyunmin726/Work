name: Bug
description: 재현 가능한 오류나 기대와 다른 동작을 등록합니다.
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        문제를 빠르게 재현하고 우선순위를 정할 수 있도록 가능한 한 구체적으로 작성해 주세요.

  - type: input
    id: summary
    attributes:
      label: 버그 요약
      description: 문제가 발생하는 상황을 한 문장으로 작성해 주세요.
      placeholder: 예) 로그인 후 대시보드가 빈 화면으로 표시됨
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 사용자 영향과 긴급도를 기준으로 선택해 주세요.
      options:
        - P0 - 즉시 대응 (서비스 중단 또는 데이터 손실)
        - P1 - 높음 (핵심 기능 장애)
        - P2 - 보통 (우회 방법이 있는 기능 장애)
        - P3 - 낮음 (경미한 오류 또는 개선)
      default: 2
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 영향 범위
      options:
        - 전체 사용자
        - 일부 사용자
        - 특정 환경 또는 브라우저
        - 개발/테스트 환경
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 데 필요한 조건과 단계를 번호 순서로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상적으로 동작했을 때의 결과를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제 결과와 오류 메시지, 로그를 작성해 주세요. 민감한 정보는 제거해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저/런타임 버전, 커밋 또는 배포 버전 등을 작성해 주세요.
      placeholder: |
        - OS:
        - Browser/Runtime:
        - Version or commit:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 증거 자료
      description: 스크린샷, 로그, 최소 재현 코드, 관련 링크를 첨부해 주세요.

  - type: textarea
    id: workaround
    attributes:
      label: 임시 해결 방법
      description: 알려진 우회 방법이 있으면 작성해 주세요.

  - type: checkboxes
    id: checklist
    attributes:
      label: 등록 전 확인
      options:
        - label: 중복 이슈를 검색했습니다.
          required: true
        - label: 민감한 정보(토큰, 비밀번호, 개인정보)를 제거했습니다.
          required: true
        - label: 재현 절차와 기대/실제 결과를 작성했습니다.
          required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 수정이 완료되었다고 판단할 수 있는 검증 조건을 작성해 주세요.
      placeholder: "- 동일 환경에서 재현되지 않음\n- 회귀 테스트 추가 및 통과"
    validations:
      required: true
