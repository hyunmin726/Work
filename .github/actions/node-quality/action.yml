name: Node.js quality checks
description: Set up Node.js, install locked dependencies, and run selected checks

inputs:
  node-version:
    description: Node.js version to install
    required: true
  run-lint:
    description: Run the lint command
    required: false
    default: "false"
  run-test:
    description: Run the test command
    required: false
    default: "false"
  run-benchmark:
    description: Measure cold and warm npm install times
    required: false
    default: "false"
  use-cache:
    description: Enable the npm cache in setup-node
    required: false
    default: "true"
  install:
    description: Run the regular npm install step
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js with npm cache
      if: inputs.use-cache == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Set up Node.js without npm cache
      if: inputs.use-cache != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci

    - name: Run lint
      if: inputs.run-lint == 'true'
      shell: bash
      run: npm run lint

    - name: Run tests
      if: inputs.run-test == 'true'
      shell: bash
      run: npm test

    - name: Measure cache performance
      if: inputs.run-benchmark == 'true'
      shell: bash
      run: node scripts/measure-npm-install.js
