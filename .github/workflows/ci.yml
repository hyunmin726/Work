name: Node.js CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    with:
      runner: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      stage: build
      artifact-name: build-${{ matrix.os }}-node-${{ matrix.node-version }}

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: build
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    with:
      runner: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      stage: test
      artifact-name: test-${{ matrix.os }}-node-${{ matrix.node-version }}
      source-artifact: build-${{ matrix.os }}-node-${{ matrix.node-version }}

  deploy:
    name: Package deployable site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Run final bundle verification
        uses: ./.github/actions/node-quality
        with:
          node-version: 20
          run-lint: "false"
          run-test: "true"

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployable-site-${{ github.sha }}
          path: |
            docs/
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
