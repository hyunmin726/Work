name: Node.js CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deployable:
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'

  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    with:
      runner: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      stage: build
      artifact-name: build-${{ matrix.os }}-node-${{ matrix.node-version }}

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: build
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    with:
      runner: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      stage: test
      artifact-name: test-${{ matrix.os }}-node-${{ matrix.node-version }}
      source-artifact: build-${{ matrix.os }}-node-${{ matrix.node-version }}

  cache-benchmark:
    name: Cache benchmark (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: test
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    with:
      runner: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      stage: benchmark
      artifact-name: benchmark-${{ matrix.os }}-node-${{ matrix.node-version }}

  cache-report:
    name: Report cache improvement
    needs: cache-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create cache performance report
        run: node scripts/report-cache-timings.js

  deploy:
    name: Package deployable site
    needs: [test, cache-report, changes]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Run final bundle verification
        uses: ./.github/actions/node-quality
        with:
          node-version: 20
          run-lint: "false"
          run-test: "true"

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployable-site-${{ github.sha }}
          path: |
            docs/
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
