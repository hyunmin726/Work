name: Collect DORA metrics

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Measurement window in days"
        required: false
        default: "7"

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DORA_WINDOW_DAYS: ${{ inputs.window_days || '7' }}
      DORA_OUTPUT_DIR: dora-output
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect metrics and create weekly report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const collect = require('./scripts/dora-metrics.js');
            await collect({ github, context, core });

      - name: Upload DORA JSON and report
        uses: actions/upload-artifact@v4
        with:
          name: dora-${{ github.run_id }}
          path: dora-output/
          retention-days: 90
