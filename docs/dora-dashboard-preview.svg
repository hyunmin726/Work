<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">DORA Metrics dashboard preview</title>
  <desc id="desc">A dark dashboard showing four DORA metric cards and two charts.</desc>
  <rect width="1000" height="520" fill="#0f172a"/>
  <text x="40" y="54" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28" font-weight="700">DORA Metrics</text>
  <text x="40" y="80" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Measurement window: 2026-10-06 – 2026-10-13</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(40 110)">
      <rect width="220" height="105" rx="12" fill="#1e293b"/><text x="18" y="28" fill="#94a3b8" font-size="14">Lead Time</text><text x="18" y="66" fill="#38bdf8" font-size="28" font-weight="700">18.4 h</text><text x="18" y="88" fill="#94a3b8" font-size="12">median merged PR → production</text>
    </g>
    <g transform="translate(280 110)">
      <rect width="220" height="105" rx="12" fill="#1e293b"/><text x="18" y="28" fill="#94a3b8" font-size="14">Deployment Frequency</text><text x="18" y="66" fill="#34d399" font-size="28" font-weight="700">9 / week</text><text x="18" y="88" fill="#94a3b8" font-size="12">successful deployments</text>
    </g>
    <g transform="translate(520 110)">
      <rect width="220" height="105" rx="12" fill="#1e293b"/><text x="18" y="28" fill="#94a3b8" font-size="14">MTTR</text><text x="18" y="66" fill="#a78bfa" font-size="28" font-weight="700">3.2 h</text><text x="18" y="88" fill="#94a3b8" font-size="12">median recovery time</text>
    </g>
    <g transform="translate(760 110)">
      <rect width="200" height="105" rx="12" fill="#1e293b"/><text x="18" y="28" fill="#94a3b8" font-size="14">Change Failure Rate</text><text x="18" y="66" fill="#fb7185" font-size="28" font-weight="700">11.1%</text><text x="18" y="88" fill="#94a3b8" font-size="12">failed / terminal deployments</text>
    </g>
    <rect x="40" y="240" width="450" height="235" rx="12" fill="#1e293b"/>
    <text x="65" y="275" fill="#e2e8f0" font-size="16" font-weight="700">Flow and recovery (hours)</text>
    <line x1="85" y1="430" x2="450" y2="430" stroke="#475569"/><line x1="85" y1="300" x2="85" y2="430" stroke="#475569"/>
    <rect x="165" y="320" width="75" height="110" fill="#38bdf8"/><rect x="320" y="410" width="75" height="20" fill="#a78bfa"/>
    <text x="174" y="452" fill="#94a3b8" font-size="13">Lead Time</text><text x="330" y="452" fill="#94a3b8" font-size="13">MTTR</text>
    <rect x="510" y="240" width="450" height="235" rx="12" fill="#1e293b"/>
    <text x="535" y="275" fill="#e2e8f0" font-size="16" font-weight="700">Deployment outcomes</text>
    <circle cx="735" cy="365" r="72" fill="none" stroke="#34d399" stroke-width="34" stroke-dasharray="390 63" transform="rotate(-90 735 365)"/>
    <circle cx="735" cy="365" r="72" fill="none" stroke="#fb7185" stroke-width="34" stroke-dasharray="63 390" stroke-dashoffset="-390" transform="rotate(-90 735 365)"/>
    <text x="685" y="465" fill="#94a3b8" font-size="13">9 successful</text><text x="795" y="465" fill="#94a3b8" font-size="13">1 failed</text>
  </g>
</svg>
