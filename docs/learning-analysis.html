<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학습 습관 분석</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-raised: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #34d399;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1080px; margin: auto; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    h1 { margin: 0; font-size: 2rem; }
    h2 { margin: 0 0 16px; font-size: 1.15rem; }
    .subtitle { margin: 8px 0 28px; color: var(--muted); }
    .panel, .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .metric-label { color: var(--muted); font-size: .85rem; }
    .metric-value { margin-top: 7px; font-size: 1.5rem; font-weight: 700; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .chart { display: grid; gap: 12px; }
    .day { display: grid; grid-template-columns: 48px 1fr 38px; gap: 8px; align-items: center; font-size: .85rem; }
    .bar-track { height: 12px; overflow: hidden; border-radius: 999px; background: var(--surface-raised); }
    .bar { height: 100%; min-width: 2px; border-radius: inherit; background: var(--primary); }
    .insights { display: grid; gap: 10px; }
    .insight { padding: 12px; border-left: 3px solid var(--success); background: var(--surface-raised); }
    .empty { color: var(--muted); line-height: 1.6; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      color: #082f49;
      background: var(--primary);
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    a { color: var(--primary); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 5px 9px; border-radius: 999px; color: #bae6fd; background: #075985; font-size: .85rem; }
    @media (max-width: 760px) {
      body { padding: 24px 12px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .dashboard { grid-template-columns: 1fr; }
    }
    @media (max-width: 440px) {
      header { display: block; }
      header button { margin-top: 12px; }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>학습 습관 분석</h1>
        <p class="subtitle">학습 기록을 바탕으로 자주 공부하는 요일과 학습 패턴을 확인하세요.</p>
      </div>
      <button type="button" id="refresh-button">분석 새로고침</button>
    </header>

    <section class="metrics" aria-label="학습 요약">
      <div class="metric"><div class="metric-label">전체 학습 기록</div><div class="metric-value" id="record-count">0개</div></div>
      <div class="metric"><div class="metric-label">총 학습 시간</div><div class="metric-value" id="total-duration">0분</div></div>
      <div class="metric"><div class="metric-label">평균 학습 시간</div><div class="metric-value" id="average-duration">0분</div></div>
      <div class="metric"><div class="metric-label">완료율</div><div class="metric-value" id="completion-rate">0%</div></div>
    </section>

    <div id="empty-state" class="panel empty" hidden>
      학습 기록이 없어 분석할 수 없습니다. <a href="study-record.html">학습 기록 관리</a>에서 기록을 추가한 뒤 다시 분석해 주세요.
    </div>

    <div id="analysis" class="dashboard">
      <section class="panel chart" aria-labelledby="weekday-title">
        <h2 id="weekday-title">요일별 학습 빈도</h2>
        <div id="weekday-chart"></div>
      </section>
      <section class="panel" aria-labelledby="pattern-title">
        <h2 id="pattern-title">발견된 학습 패턴</h2>
        <div class="insights" id="insights"></div>
      </section>
      <section class="panel" aria-labelledby="tag-title">
        <h2 id="tag-title">자주 학습한 주제</h2>
        <div class="tag-list" id="tag-list"></div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "study-records";
    const weekdays = ["일", "월", "화", "수", "목", "금", "토"];

    document.querySelector("#refresh-button").addEventListener("click", analyze);
    analyze();

    function analyze() {
      const records = loadRecords();
      const totalMinutes = records.reduce((sum, record) => sum + record.duration, 0);
      const completed = records.filter((record) => record.status === "completed").length;
      document.querySelector("#record-count").textContent = `${records.length}개`;
      document.querySelector("#total-duration").textContent = formatDuration(totalMinutes);
      document.querySelector("#average-duration").textContent = formatDuration(records.length ? totalMinutes / records.length : 0);
      document.querySelector("#completion-rate").textContent = records.length ? `${Math.round(completed / records.length * 100)}%` : "0%";

      const hasRecords = records.length > 0;
      document.querySelector("#empty-state").hidden = hasRecords;
      document.querySelector("#analysis").hidden = !hasRecords;
      if (!hasRecords) return;

      renderWeekdayChart(records);
      renderInsights(records, totalMinutes);
      renderTags(records);
    }

    function loadRecords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return [];
        return saved.filter((record) =>
          record &&
          typeof record.date === "string" &&
          Number.isFinite(Number(record.duration)) &&
          Number(record.duration) > 0
        ).map((record) => ({
          ...record,
          duration: Number(record.duration),
          tags: Array.isArray(record.tags) ? record.tags : []
        }));
      } catch {
        return [];
      }
    }

    function renderWeekdayChart(records) {
      const counts = Array(7).fill(0);
      records.forEach((record) => {
        const day = new Date(`${record.date}T00:00:00`).getDay();
        if (Number.isInteger(day)) counts[day] += 1;
      });
      const max = Math.max(...counts, 1);
      const chart = document.querySelector("#weekday-chart");
      chart.replaceChildren();
      counts.forEach((count, index) => {
        const row = document.createElement("div");
        row.className = "day";
        const label = document.createElement("span");
        label.textContent = `${weekdays[index]}요일`;
        const track = document.createElement("div");
        track.className = "bar-track";
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = `${count / max * 100}%`;
        track.append(bar);
        const value = document.createElement("span");
        value.textContent = `${count}회`;
        row.append(label, track, value);
        chart.append(row);
      });
    }

    function renderInsights(records, totalMinutes) {
      const dayCounts = Array(7).fill(0);
      records.forEach((record) => {
        dayCounts[new Date(`${record.date}T00:00:00`).getDay()] += 1;
      });
      const maxDayCount = Math.max(...dayCounts);
      const preferredDays = dayCounts
        .map((count, index) => count === maxDayCount ? weekdays[index] : null)
        .filter(Boolean);
      const average = totalMinutes / records.length;
      const completedRate = records.filter((record) => record.status === "completed").length / records.length;
      const insights = [
        preferredDays.length > 1
          ? `${preferredDays.join(", ")}요일에 가장 자주 학습하고 있습니다 (각 ${maxDayCount}회).`
          : `${preferredDays[0]}요일에 가장 자주 학습하고 있습니다 (${maxDayCount}회).`,
        average >= 90 ? `평균 ${formatDuration(average)}의 집중 세션을 유지하고 있습니다.` : "평균 학습 시간이 1시간 30분보다 짧습니다. 짧은 세션을 여러 번 이어가는 방법도 시도해 보세요.",
        completedRate >= 0.8 ? "완료율이 80% 이상으로 안정적인 학습 습관을 보이고 있습니다." : "완료율을 높이려면 한 번에 달성할 수 있는 작은 학습 목표를 설정해 보세요."
      ];
      const container = document.querySelector("#insights");
      container.replaceChildren();
      insights.forEach((text) => {
        const item = document.createElement("div");
        item.className = "insight";
        item.textContent = text;
        container.append(item);
      });
    }

    function renderTags(records) {
      const tagCounts = new Map();
      records.flatMap((record) => record.tags).forEach((tag) => {
        if (tag) tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
      });
      const tags = [...tagCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
      const container = document.querySelector("#tag-list");
      container.replaceChildren();
      if (!tags.length) {
        const empty = document.createElement("span");
        empty.className = "empty";
        empty.textContent = "태그가 있는 기록이 없습니다.";
        container.append(empty);
        return;
      }
      tags.forEach(([tag, count]) => {
        const item = document.createElement("span");
        item.className = "tag";
        item.textContent = `#${tag} ${count}회`;
        container.append(item);
      });
    }

    function formatDuration(minutes) {
      const rounded = Math.round(minutes);
      const hours = Math.floor(rounded / 60);
      const remainingMinutes = rounded % 60;
      return hours ? `${hours}시간 ${remainingMinutes}분` : `${remainingMinutes}분`;
    }
  </script>
</body>
</html>
