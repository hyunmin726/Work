    .links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    a { display: block; padding: 20px; border: 1px solid #334155; border-radius: 14px; color: var(--text); background: var(--card); text-decoration: none; }
    a:hover { border-color: var(--primary); } strong { display: block; margin-bottom: 8px; color: var(--primary); } span { color: var(--muted); font-size: .9rem; }
    @media (max-width: 600px) { .links { grid-template-columns: 1fr; } }
